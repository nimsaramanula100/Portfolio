<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="pointerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a8a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pointerInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#006880;stop-opacity:0.6" />
    </linearGradient>
    <filter id="pointerGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main pointer arrow - hand/click variant -->
  <polygon points="5,2 10,16 3,14 16,36 14,18 20,20 5,2" fill="url(#pointerGrad)" stroke="#00e5ff" stroke-width="0.6" filter="url(#pointerGlow)"/>
  <!-- Inner highlight -->
  <line x1="7" y1="6" x2="14" y2="26" stroke="url(#pointerInner)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Energy dots -->
  <circle cx="8" cy="9" r="1.2" fill="#00e5ff" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.4;0.95" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="15" r="0.9" fill="#00e5ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="21" r="0.6" fill="#00e5ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
