<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a8a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#006880;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main arrow body -->
  <polygon points="4,2 8,14 2,12 14,30 12,16 18,18 4,2" fill="url(#cursorGrad)" stroke="#00e5ff" stroke-width="0.5" filter="url(#glow)"/>
  <!-- Inner highlight line -->
  <line x1="6" y1="5" x2="12" y2="22" stroke="url(#innerGrad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Dot accents -->
  <circle cx="7" cy="8" r="1" fill="#00e5ff" opacity="0.9"/>
  <circle cx="9" cy="13" r="0.7" fill="#00e5ff" opacity="0.7"/>
</svg>
